<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Комикс</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: sans-serif;
        }

        .pdf-container {
            position: fixed;
            top: 50px; /* отступ под панель кнопок */
            left: 0;
            width: 100vw;
            height: calc(100vh - 50px);
            overflow: hidden;
        }

        .pdf-container embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #111;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .btn {
            background: #444;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #666;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn" onclick="history.back()">← Назад</button>
        <button class="btn" onclick="history.forward()">Вперёд →</button>
    </div>

    <div class="pdf-container">
        <embed src="pdf/comic.pdf" type="application/pdf" />
    </div>

</body>
</html>
