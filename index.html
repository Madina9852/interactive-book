<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровая страница</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff7ac4, #47ff68, #ff3a3a);
            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
            color: white;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            width: 100%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(6px);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        /* Новые кнопки */
        .nav-btn {
            padding: 12px 25px;
            font-size: 17px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
            background: linear-gradient(135deg, #ff4bd2, #2aff75, #ff2a2a);
            background-size: 200% 200%;
            animation: btnGradient 4s infinite alternate;
            transition: transform 0.2s;
        }

        .nav-btn:hover {
            transform: scale(1.08);
        }

        @keyframes btnGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        h1 {
            font-size: 42px;
            margin-top: 35px;
        }

        #imageBox {
            width: 80%;
            max-width: 520px;
            margin: 35px auto;
        }

        #imageBox img {
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* Красная круглая кнопка */
        #spinButton {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 6px solid white;
            background: radial-gradient(circle, #ff4a4a, #b70000);
            margin: 45px auto;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255,0,0,0.6);
            transition: 0.2s ease;
        }

            transform: scale(1.07);
        }
