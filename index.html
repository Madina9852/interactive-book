<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровая страница</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: white;
        }

        h1 {
            font-size: 40px;
            margin-top: 40px;
            font-weight: bold;
        }

        #imageBox {
            width: 80%;
            max-width: 500px;
            margin: 40px auto;
        }

        #imageBox img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }

        /* красная кнопка */
        #spinButton {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 6px solid white;
            background: radial-gradient(circle, #ff4a4a, #b70000);
            margin: 50px auto;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
            transition: 0.2s;
        }

        #spinButton:active {
            transform: scale(0.92);
        }
    </style>
</head>

<body>

    <h1>прокрути барабан:</h1>

    <div id="imageBox">
        <img id="slotImage" src="pdf/ludo.img" alt="image">
    </div>

    <div id="spinButton"></div>

    <script>
        // изображения внутри папки pdf
        const images = [
            "pdf/ludo.img",
            "pdf/narko.img",
            "pdf/url.img"
        ];

        const imgElement = document.getElementById("slotImage");
        const button = document.getElementById("spinButton");

        let spinning = false;

        button.addEventListener("click", () => {
            if (spinning) return;
            spinning = true;

            let counter = 0;

            // быстрый эффект перемешивания
            const spinInterval = setInterval(() => {
                const randomImg = images[Math.floor(Math.random() * images.length)];
                imgElement.src = randomImg;
                counter++;
            }, 120);

            // остановка через 2 секунды
            setTimeout(() => {
                clearInterval(spinInterval);

                const finalImg = images[Math.floor(Math.random() * images.length)];
                imgElement.src = finalImg;

                spinning = false;
            }, 2000);
        });
    </script>

</body>
</html>
